# OSRM standalone: solo para desarrollo local (geoapi corriendo con mvn spring-boot:run).
# Si levantás el docker-compose.yml completo NO uses este archivo: ese ya incluye el servicio
# "osrm" con el mismo nombre de contenedor y chocarían.
services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: >
      osrm-routed --algorithm ch /data/argentina-latest.osrm
