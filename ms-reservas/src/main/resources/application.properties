server.port=8082
spring.application.name=ms-reservas

# Base de datos H2 en memoria para desarrollo local
spring.datasource.url=jdbc:h2:mem:reservasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger OpenAPI interactivo (/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# URLs de los Microservicios Colaboradores
servicios.catalogo.url=${MS_CATALOGO_URL:http://localhost:8081/api/v1/catalogo}
servicios.geoapi.url=${GEOAPI_URL:http://localhost:8083/api/v1/geo}
servicios.openmeteo.url=https://api.open-meteo.com/v1/forecast

# Servidor de correos Mailpit (SMTP local)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Revalidación periódica de reservas (baja de actividad, cupo, temporada, clima y regla de 48 hs)
# Por defecto cada hora en punto. Formato cron de Spring: seg min hora día mes díaSemana
reservas.revalidacion.habilitada=${REVALIDACION_HABILITADA:true}
reservas.revalidacion.cron=${REVALIDACION_CRON:0 0 * * * *}

# Respeta los headers X-Forwarded-* del Gateway: Swagger arma las URLs de "Try it out" contra http://localhost:8080
server.forward-headers-strategy=framework

# Logging (Apunte 23/24): cada línea muestra el Correlation ID de la petición entre corchetes
logging.pattern.level=%5p [%X{correlationId:-}]

# Actuator (Apunte 24): estado y métricas del servicio. No se publica fuera de Docker (trusted zone);
# lo usa el healthcheck del docker-compose.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# El correo no es crítico (si falla, la reserva sigue): no debe marcar el servicio como caído
management.health.mail.enabled=false
info.app.name=ms-reservas
info.app.descripcion=Reservas, reglas de negocio y revalidacion
# Spring Boot 3 no publica las propiedades info.* salvo que se habilite
management.info.env.enabled=true
