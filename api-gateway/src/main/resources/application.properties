# 1. Puerto del Gateway (Punto único de entrada para clientes/frontend)
server.port=8080

# 2. Nombre de la aplicación
spring.application.name=api-gateway

# 3. URLs de los microservicios con soporte para variables de entorno (12-Factor App)
tpi.gateway.ms-catalogo-url=${MS_CATALOGO_URL:http://localhost:8081}
tpi.gateway.ms-reservas-url=${MS_RESERVAS_URL:http://localhost:8082}
tpi.gateway.geoapi-url=${GEOAPI_URL:http://localhost:8083}

# 4. Configuración Global de CORS (Cross-Origin Resource Sharing)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

# 5. Seguridad OAuth2 Resource Server / Keycloak (puerto 8180 para pruebas locales)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/tpi-realm/protocol/openid-connect/certs}


# 6. Swagger UI agrupado (http://localhost:8080/swagger-ui.html): un desplegable con la API de cada microservicio.
#    Las rutas /api-docs/** del GatewayConfig reenvían a /v3/api-docs de cada servicio.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Catalogo (ms-catalogo)
springdoc.swagger-ui.urls[0].url=/api-docs/catalogo
springdoc.swagger-ui.urls[1].name=Reservas (ms-reservas)
springdoc.swagger-ui.urls[1].url=/api-docs/reservas
springdoc.swagger-ui.urls[2].name=GeoAPI (geoapi)
springdoc.swagger-ui.urls[2].url=/api-docs/geoapi
