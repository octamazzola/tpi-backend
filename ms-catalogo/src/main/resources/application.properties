# 1. Puerto del microservicio (según README.md)
server.port=8081

# 2. Nombre de la aplicación
spring.application.name=ms-catalogo

# 3. Base de datos H2 en memoria para desarrollo local
spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 4. Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Habilitar consola web de H2 (accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 6. Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Respeta los headers X-Forwarded-* del Gateway: Swagger arma las URLs de "Try it out" contra http://localhost:8080
server.forward-headers-strategy=framework

# Logging (Apunte 23/24): cada línea muestra el Correlation ID de la petición entre corchetes
logging.pattern.level=%5p [%X{correlationId:-}]

# Actuator (Apunte 24): estado y métricas del servicio. No se publica fuera de Docker (trusted zone);
# lo usa el healthcheck del docker-compose.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=ms-catalogo
info.app.descripcion=Actividades y categorias del catalogo
# Spring Boot 3 no publica las propiedades info.* salvo que se habilite
management.info.env.enabled=true
