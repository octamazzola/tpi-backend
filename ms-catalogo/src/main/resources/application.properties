# 1. Puerto del microservicio (según README.md)
server.port=8081

# 2. Nombre de la aplicación
spring.application.name=ms-catalogo

# 3. Base de datos H2 en memoria para desarrollo local
spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 4. Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Habilitar consola web de H2 (accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 6. Ruta de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
