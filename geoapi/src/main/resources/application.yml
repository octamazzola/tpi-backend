spring:
  application:
    name: geoapi

server:
  port: ${SERVER_PORT:8083}

osrm:
  base-url: ${OSRM_BASE_URL:http://localhost:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
