spring:
  application:
    name: geoapi

server:
  port: ${SERVER_PORT:8083}
  # Respeta X-Forwarded-* del Gateway para que Swagger apunte a http://localhost:8080
  forward-headers-strategy: framework

osrm:
  base-url: ${OSRM_BASE_URL:http://localhost:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
