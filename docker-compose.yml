services:
  # =========================================================================
  # 1. Base de Datos Relacional: PostgreSQL 16
  # =========================================================================
  postgres-db:
    image: postgres:16-alpine # Imagen oficial minimalista (~30MB)
    container_name: postgres-db
    environment:
      # Variables que Postgres lee en su primer arranque para crear la BD y usuario
      POSTGRES_DB: catalogodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Formato HOST:CONTENEDOR. Permite conectar DBeaver / pgAdmin desde tu máquina en localhost:5432
      - "5432:5432"
    volumes:
      # Volumen nombrado persistente: los datos se guardan en el disco del host
      # para no perder las tablas si se destruye o recrea el contenedor
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Evita race conditions: verifica cada 5s si el motor ya acepta conexiones reales
      test: [ "CMD-SHELL", "pg_isready -U postgres -d catalogodb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tpi-network

  # =========================================================================
  # 2. Servidor de Correos Local: Mailpit (SMTP + Web UI para pruebas)
  # =========================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      # Puerto 1025: Servidor SMTP donde Spring Boot (ms-reservas) envía los emails
      - "1025:1025"
      # Puerto 8025: Bandeja de entrada web visual (http://localhost:8025)
      - "8025:8025"
    restart: unless-stopped
    networks:
      - tpi-network

  # =========================================================================
  # 3. Identity Provider (IdP): Keycloak 24 (OIDC / OAuth2 / Tokens JWT)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      # Puerto 8180 mapeado al 8080 del contenedor para no colisionar con el Gateway
      - "8180:8080"
    restart: unless-stopped
    networks:
      - tpi-network

  # =========================================================================
  # 4. Microservicio de Catálogo (Spring Boot 3.3.5 / Java 21)
  # =========================================================================
  ms-catalogo:
    container_name: ms-catalogo
    build:
      context: ./ms-catalogo # Carpeta donde reside el proyecto
      dockerfile: Dockerfile  # Receta para construir la imagen JRE 21 Alpine
    ports:
      # Permite acceder a Swagger UI en http://localhost:8081/swagger-ui.html
      - "8081:8081"
    environment:
      # Inyección de configuración (12-Factor App): sobreescribe application.properties
      SPRING_APPLICATION_NAME: ms-catalogo
      SERVER_PORT: 8081
      # Conexión JDBC: el host 'postgres-db' se resuelve por el DNS interno de Docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/catalogodb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Dialecto para que Hibernate genere DDL y SQL óptimo para Postgres
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false" # Apagamos H2 en este entorno
    depends_on:
      # ms-catalogo NO arranca hasta que postgres-db pase exitosamente su healthcheck
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tpi-network

  # =========================================================================
  # Microservicio de Reservas (Spring Boot 3.3.5 / Java 21)
  # =========================================================================
  ms-reservas:
    container_name: ms-reservas
    build:
      context: ./ms-reservas
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: ms-reservas
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/reservasdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"
      MS_CATALOGO_URL: http://ms-catalogo:8081/api/v1/catalogo
      GEOAPI_URL: http://geoapi:8083/api/v1/geo
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    depends_on:
      postgres-db:
        condition: service_healthy
      ms-catalogo:
        condition: service_started
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tpi-network

  # =========================================================================
  # 5. API Gateway (Spring Cloud Gateway / Puerto 8080)
  # =========================================================================
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      # Punto único de entrada al sistema para el cliente / frontend
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      # En la red virtual de Docker, los hosts se resuelven por el nombre del contenedor
      MS_CATALOGO_URL: http://ms-catalogo:8081
      MS_RESERVAS_URL: http://ms-reservas:8082
      GEOAPI_URL: http://geoapi:8083
      # URL interna de Keycloak dentro de Docker
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/tpi-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tpi-realm/protocol/openid-connect/certs
    depends_on:
      - ms-catalogo
      - keycloak
    restart: unless-stopped
    networks:
      - tpi-network

# =========================================================================
# Volúmenes administrados por Docker
# =========================================================================
volumes:
  # Espacio en disco persistente fuera del ciclo de vida de los contenedores
  postgres-data:

# =========================================================================
# Red virtual privada (Bridge Network)
# =========================================================================
networks:
  # Switch virtual donde los contenedores se comunican entre sí por nombre de servicio
  tpi-network:
    driver: bridge
